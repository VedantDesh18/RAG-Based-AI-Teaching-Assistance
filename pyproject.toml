[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "videoqa"
version = "0.1.0"
description = "Turn any video into a conversation"
authors = [
    {name = "VideoQA Team"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "yt-dlp",
    "faster-whisper",
    "chromadb",
    "pydantic",
    "python-multipart",
    "requests",
    "webvtt-py",
    "joblib",
    "pandas",
    "scikit-learn",
    "pyyaml",
    "google-genai",
    "python-dotenv"
]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: marks tests requiring live Ollama",
    "live_gemini: marks tests requiring live Gemini API key"
]

[tool.setuptools.packages.find]
include = ["videoqa*"]
